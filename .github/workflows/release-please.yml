name: release-please

on:
  push:
    branches: [main]
  # Re-publish path for a version that was already released. release-please fires exactly
  # once per version, so without this there is no way to rebuild and re-push the six images
  # and the two charts (e.g. after a registry loss or a base-image CVE) short of faking a
  # release commit. A dispatch run publishes artifacts only -- it never touches
  # release-please's manifest, tags or release PRs.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to rebuild and push, without a leading 'v' (e.g. 0.3.0). Empty = the current root version from .release-please-manifest.json."
        required: false
        type: string
        default: ""

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      # Both come from the resolve step rather than straight from release-please, because
      # they have two sources: release-please on push, the dispatch input on a manual run.
      # Funnelling them through one step keeps every downstream gate a plain
      # `root-released == 'true'` check that needs to know nothing about the event.
      root-released: ${{ steps.resolve.outputs.released }}
      root-version: ${{ steps.resolve.outputs.version }}
      # The component packages keep their `<path>--<key>` prefix (see the resolve step for
      # why the root package does not) and are intentionally left empty on a manual
      # dispatch -- see the note on the two Maven jobs at the bottom of this file.
      telemetry-released: ${{ steps.release.outputs['telemetry-addon--release_created'] }}
      paper-released: ${{ steps.release.outputs['paper-worldpush--release_created'] }}
    steps:
      - id: release
        # Never on a manual dispatch: release-please would open or update a release PR for
        # the next version, which is the exact opposite of re-publishing an existing one.
        # Skipped steps produce empty outputs, which the resolve step below relies on.
        if: github.event_name == 'push'
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - uses: actions/checkout@v5
        # Only the dispatch path needs a working tree, to read the manifest fallback below.
        # release-please-action works purely through the API and needs no checkout.
        if: github.event_name == 'workflow_dispatch'
      - id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          # The root package is the one exception to the `<path>--<key>` output naming:
          # release-please-action's setPathOutput() emits the bare key when the package path
          # is ".", so `.--release_created` is always empty and every image publish silently
          # skipped. Only the two component packages carry a prefix.
          RELEASE_CREATED: ${{ steps.release.outputs.release_created }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          # Empty for any event other than workflow_dispatch.
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            # actions/checkout resolved github.ref, so the jars, Dockerfiles and chart
            # templates this run is about to build are whatever *that ref* holds. The
            # manifest of that tree is therefore the only authority on which version this
            # content actually is -- the input cannot override it, it can only confirm it.
            # Dispatching from main (0.3.0) with version 0.2.1 would otherwise rebuild HEAD,
            # push it over the released 0.2.1 images and charts, and then sign the result,
            # which is precisely what would make the wrong artifact look authoritative.
            tree_version="$(jq -er '."."' .release-please-manifest.json)"
            # An empty input means "publish whatever this tree says it is".
            version="${INPUT_VERSION:-${tree_version}}"
            # Shape first, so a leading "v" gets its own precise message instead of a
            # mismatch complaint against a value it superficially resembles.
            if ! printf '%s' "${version}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)*$'; then
              echo "::error::'${version}' is not a bare semver version (expected e.g. ${tree_version}, no leading 'v')" >&2
              exit 1
            fi
            if [ "${version}" != "${tree_version}" ]; then
              echo "::error::version '${version}' does not match the checked-out tree, which is at '${tree_version}'. Re-run this workflow from the tag whose version you want to publish (ref 'apus-v${version}'), or leave the version input empty to publish '${tree_version}'." >&2
              exit 1
            fi
            # The dispatch itself is the publish signal; there is no release-please run to ask.
            released=true
          else
            version="${RELEASE_VERSION}"
            # Empty when release-please created no release, which keeps every publish gate
            # false. Passed through verbatim rather than normalised, so a push that released
            # nothing can never turn into a publish.
            released="${RELEASE_CREATED}"
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "released=${released}" >> "${GITHUB_OUTPUT}"

  build-context:
    needs: release-please
    if: needs.release-please.outputs.root-released == 'true'
    uses: OneLiteFeatherNET/workflows/.github/workflows/gradle-docker-context.yml@v2.4.0
    with:
      java-version: "25"
      version: ${{ needs.release-please.outputs.root-version }}
      gradle-command: "./gradlew :telemetry-addon:shadowJar :ingest:shadowJar :operator:shadowJar :api:shadowJar"
      # Only the four shadow jars are needed by the Dockerfiles. Uploading "." would ship
      # the whole working tree (including .git and every build/ directory -- hundreds of
      # MB) because the central workflow passes context-path straight to
      # actions/upload-artifact with include-hidden-files: true.
      # upload-artifact roots the archive at the least common ancestor of the matched
      # files; the four jars live in four different top-level modules, so that ancestor is
      # the workspace root and the artifact keeps the `<module>/build/libs/` prefix the
      # Dockerfiles COPY by name.
      context-path: "**/build/libs/*.jar"
      artifact-name: "docker-context"
    secrets: inherit

  # The six publish-* jobs below are chained with `needs` on purpose -- do NOT "optimise"
  # them back into parallel jobs. docker-publish.yml@v2.4.0 declares
  #   concurrency: group: docker-publish-${{ github.workflow }}-${{ github.ref }}
  # which every one of these six calls evaluates to the identical string, and a caller
  # cannot override a callee's concurrency. Running them in parallel therefore puts all six
  # in one concurrency group where they cancel each other. Serialising them keeps at most
  # one of them pending at any time. (The proper fix is a `concurrency-suffix` input on the
  # central docker-publish.yml; that is an upstream change.)
  publish-runner:
    needs: [release-please, build-context]
    # First link of the chain. The three jobs after it gate on build-context's own result
    # rather than on their predecessor, so a single failing image does not silently skip
    # the rest -- the chain exists for serialisation only, not to express a dependency.
    if: ${{ !cancelled() && needs.build-context.result == 'success' }}
    permissions:
      contents: read
      id-token: write
    uses: OneLiteFeatherNET/workflows/.github/workflows/docker-publish.yml@v2.4.0
    with:
      image-name: "apus/runner"
      version: ${{ needs.release-please.outputs.root-version }}
      context: "."
      dockerfile: "runner/Dockerfile"
      artifact-name: "docker-context"
    secrets: inherit

  publish-ingest:
    needs: [release-please, build-context, publish-runner]
    if: ${{ !cancelled() && needs.build-context.result == 'success' }}
    permissions:
      contents: read
      id-token: write
    uses: OneLiteFeatherNET/workflows/.github/workflows/docker-publish.yml@v2.4.0
    with:
      image-name: "apus/ingest"
      version: ${{ needs.release-please.outputs.root-version }}
      context: "."
      dockerfile: "ingest/Dockerfile"
      artifact-name: "docker-context"
    secrets: inherit

  publish-hosting:
    # publish-api is a chain link only (see the concurrency note above); hosting builds
    # from the checked-out repo and needs no Gradle artifact, so `!cancelled()` keeps its
    # gate standalone -- it publishes whenever a root release happened, even if one of the
    # Gradle-based images failed.
    needs: [release-please, publish-api]
    if: ${{ !cancelled() && needs.release-please.outputs.root-released == 'true' }}
    permissions:
      contents: read
      id-token: write
    uses: OneLiteFeatherNET/workflows/.github/workflows/docker-publish.yml@v2.4.0
    with:
      image-name: "apus/hosting"
      version: ${{ needs.release-please.outputs.root-version }}
      context: "hosting"
      dockerfile: "hosting/Dockerfile"
    secrets: inherit

  publish-operator:
    needs: [release-please, build-context, publish-ingest]
    if: ${{ !cancelled() && needs.build-context.result == 'success' }}
    permissions:
      contents: read
      id-token: write
    uses: OneLiteFeatherNET/workflows/.github/workflows/docker-publish.yml@v2.4.0
    with:
      image-name: "apus/operator"
      version: ${{ needs.release-please.outputs.root-version }}
      context: "."
      dockerfile: "operator/Dockerfile"
      artifact-name: "docker-context"
    secrets: inherit

  publish-api:
    needs: [release-please, build-context, publish-operator]
    if: ${{ !cancelled() && needs.build-context.result == 'success' }}
    permissions:
      contents: read
      id-token: write
    uses: OneLiteFeatherNET/workflows/.github/workflows/docker-publish.yml@v2.4.0
    with:
      image-name: "apus/api"
      version: ${{ needs.release-please.outputs.root-version }}
      context: "."
      dockerfile: "api/Dockerfile"
      artifact-name: "docker-context"
    secrets: inherit

  publish-ui:
    # Last chain link; same standalone gate as publish-hosting.
    needs: [release-please, publish-hosting]
    if: ${{ !cancelled() && needs.release-please.outputs.root-released == 'true' }}
    permissions:
      contents: read
      id-token: write
    uses: OneLiteFeatherNET/workflows/.github/workflows/docker-publish.yml@v2.4.0
    with:
      image-name: "apus/ui"
      version: ${{ needs.release-please.outputs.root-version }}
      context: "."
      dockerfile: "ui/Dockerfile"
    secrets: inherit

  publish-charts:
    needs: [release-please, publish-ui]
    # Last link of the publish chain (see the concurrency note above). Charts go to the
    # same registry as the images, so they share its serialisation constraint.
    if: ${{ !cancelled() && needs.release-please.outputs.root-released == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for keyless cosign signing below: without it the OIDC token request
      # returns 403 and the sign step fails. Same grant the six image jobs already carry.
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4
        with:
          # Same pin, same reason as build-pr.yml (see the comment there): the chart that ships
          # must be packaged by the exact Helm version the PR job linted and rendered it with.
          version: v4.2.2
      - name: Install Cosign
        # Installed before the push, not after it: a cosign install that fails would
        # otherwise leave two charts published in the registry that nothing ever signs.
        uses: sigstore/cosign-installer@v4.1.2
      - name: Package and push charts
        id: push
        env:
          HARBOR_REGISTRY: ${{ secrets.HARBOR_REGISTRY }}
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
          VERSION: ${{ needs.release-please.outputs.root-version }}
        run: |
          # Deliberately no `helm registry login`. Like regctl's login it starts with an
          # anonymous connectivity ping, and this Harbor answers that with a 401 carrying no
          # WWW-Authenticate header -- the `empty challenge header` failure the image push hit
          # until the org's docker-publish.yml switched to `regctl registry login --skip-check`
          # ("skips its anonymous connectivity ping, which a private registry answers with 401;
          # credentials are exercised during the push"). Helm has no --skip-check, so the same
          # idea is applied one level down: write the credential file `helm registry login`
          # would have written and hand it to `helm push`, which authenticates on the push
          # request itself. The file is docker's config.json format -- the format Helm's own
          # login writes and its ORAS client reads.
          # Pushing the .tgz with regctl instead would drop Helm from the publish path entirely
          # and make us hand-assemble the chart's OCI config and layer media types; keeping
          # `helm push` means the artifact stays exactly what `helm pull` expects.
          config="${RUNNER_TEMP}/helm-registry-config.json"
          umask 077
          printf '{"auths":{"%s":{"auth":"%s"}}}' \
            "${HARBOR_REGISTRY}" \
            "$(printf '%s:%s' "${HARBOR_USERNAME}" "${HARBOR_PASSWORD}" | base64 -w0)" \
            > "${config}"
          trap 'rm -f "${config}"' EXIT
          refs=()
          for chart in apus-operator apus-platform; do
            # --version/--app-version instead of trusting Chart.yaml: `helm package` names the
            # .tgz after the chart's own version, and on a manual dispatch the checked-out
            # Chart.yaml can name a different version than the one being published. That would
            # break the `${chart}-${VERSION}.tgz` filename below and, worse, ship a chart whose
            # appVersion -- which every image tag in the templates falls back to -- points at
            # images from another release. On the push path both values are already identical.
            helm package "deploy/charts/${chart}" --version "${VERSION}" --app-version "${VERSION}"
            log="${RUNNER_TEMP}/helm-push-${chart}.log"
            # `helm push` prints its "Digest: sha256:..." line to stderr, so 2>&1 is what
            # makes it readable at all. The default shell for a `run:` block without an
            # explicit `shell:` key is `bash -e {0}` -- note: no pipefail -- so a pipeline
            # reports tee's exit status and a failed push would sail through as success.
            # PIPESTATUS[0] is helm's own status; it is read on the very next line, before
            # anything else can overwrite the array.
            helm push "${chart}-${VERSION}.tgz" "oci://${HARBOR_REGISTRY}/apus/charts" \
              --registry-config "${config}" 2>&1 | tee "${log}"
            status="${PIPESTATUS[0]}"
            [ "${status}" -eq 0 ] || exit "${status}"
            # Sign the digest, never the tag: a tag can later be repointed at other content,
            # which would leave a valid signature vouching for something nobody reviewed.
            digest="$(sed -n -E 's/^[[:space:]]*Digest:[[:space:]]*(sha256:[0-9a-f]{64}).*$/\1/p' "${log}" | head -n1)"
            if [ -z "${digest}" ]; then
              # Loud failure on purpose. Skipping the signature here would publish a chart
              # that looks exactly like a signed one to anyone who does not check.
              echo "::error::no digest found in helm push output for ${chart}; refusing to leave the pushed chart unsigned" >&2
              exit 1
            fi
            refs+=("${HARBOR_REGISTRY}/apus/charts/${chart}@${digest}")
          done
          {
            echo 'refs<<CHART_REFS_EOF'
            printf '%s\n' "${refs[@]}"
            echo 'CHART_REFS_EOF'
          } >> "${GITHUB_OUTPUT}"
      - name: Sign the charts (keyless)
        env:
          CHART_REFS: ${{ steps.push.outputs.refs }}
          COSIGN_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          COSIGN_PASSWORD_REG: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          # Keyless signing via the GitHub Actions OIDC identity (no key, no password) --
          # the same mechanism docker-publish.yml@v2.4.0 applies to the images, so charts and
          # images end up verifiable against one and the same identity.
          # cosign does not read helm's --registry-config; it takes its own registry flags.
          while IFS= read -r ref; do
            [ -n "${ref}" ] || continue
            cosign sign --yes \
              --registry-username="${COSIGN_USERNAME}" \
              --registry-password="${COSIGN_PASSWORD_REG}" \
              "${ref}"
          done <<< "${CHART_REFS}"
      - name: Verify the chart signatures
        env:
          CHART_REFS: ${{ steps.push.outputs.refs }}
          COSIGN_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          COSIGN_PASSWORD_REG: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          # A signature nobody verifies is decoration: this step is what proves the signature
          # was actually stored next to the chart and was issued to this workflow.
          # The identity is this workflow's own path at its ref, because publish-charts runs
          # here rather than through `uses:` -- for a reusable workflow the certificate SAN
          # would name the callee's path instead, and this regexp would never match.
          # GITHUB_REPOSITORY is interpolated into a regexp, so every character that is not
          # plainly literal is escaped first: a '.' in an org or repo name would otherwise be
          # a wildcard and accept identities from repositories nobody vetted.
          repo_re="$(printf '%s' "${GITHUB_REPOSITORY}" | sed 's/[^A-Za-z0-9/_-]/\\&/g')"
          # Anchored at both ends and restricted to the only two refs allowed to publish:
          # main (the push path) and a root release tag (the dispatch path). An unanchored
          # '@refs/' tail would accept a certificate issued to any branch of this repository.
          identity="^https://github\.com/${repo_re}/\.github/workflows/release-please\.yml@refs/(heads/main|tags/apus-v.*)\$"
          while IFS= read -r ref; do
            [ -n "${ref}" ] || continue
            cosign verify \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --certificate-identity-regexp "${identity}" \
              --registry-username="${COSIGN_USERNAME}" \
              --registry-password="${COSIGN_PASSWORD_REG}" \
              "${ref}" > /dev/null
          done <<< "${CHART_REFS}"

  # The two Maven jobs below are deliberately NOT reachable from a manual dispatch: their
  # gates read the component outputs, which stay empty when release-please does not run.
  # Two reasons, both deliberate:
  #   - telemetry-addon and paper-worldpush are separate release-please packages on their own
  #     version tracks (0.2.0 while the root is at 0.3.0). The dispatch input is a *root*
  #     version and names nothing publishable in either component.
  #   - Re-publishing an existing version to a Maven repository is either rejected outright or
  #     overwrites an artifact consumers have already resolved and cached, which breaks build
  #     reproducibility after the fact. An OCI registry re-push is recoverable in a way a
  #     mutated Maven release is not.
  # A component that genuinely needs re-publishing wants its own dispatch input and its own
  # version, not this one.
  publish-telemetry-addon:
    needs: release-please
    if: needs.release-please.outputs.telemetry-released == 'true'
    # Narrow the workflow-level `contents: write, pull-requests: write` down to what a
    # Maven publish actually needs, matching the six Docker jobs.
    permissions:
      contents: read
    uses: OneLiteFeatherNET/workflows/.github/workflows/gradle-publish.yml@v2.4.0
    with:
      java-version: "25"
      java-distribution: "temurin"
      build-task: ":telemetry-addon:build"
      publish-task: ":telemetry-addon:publish"
    secrets: inherit

  publish-paper-worldpush:
    needs: release-please
    if: needs.release-please.outputs.paper-released == 'true'
    permissions:
      contents: read
    uses: OneLiteFeatherNET/workflows/.github/workflows/gradle-publish.yml@v2.4.0
    with:
      java-version: "25"
      java-distribution: "temurin"
      build-task: ":paper-worldpush:build"
      publish-task: ":paper-worldpush:publish"
    secrets: inherit
