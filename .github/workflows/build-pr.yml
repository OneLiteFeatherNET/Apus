name: build-pr

on:
  pull_request:
    branches: [main]

jobs:
  gradle:
    uses: OneLiteFeatherNET/workflows/.github/workflows/gradle-build-pr.yml@v2.4.0
    with:
      java-version: "25"
      java-distribution: "temurin"
      # The central default is a three-OS matrix. Apus only ever ships to Linux
      # containers, so windows/macos runners would burn minutes on a platform nothing
      # deploys to.
      runs-on: '["ubuntu-latest"]'
      paths-filters: |
        code:
          - '**/*.java'
          - '**/*.kts'
          - '**/*.properties'
          - 'gradle/**'
          - 'gradlew'
          - 'gradlew.bat'
          - '.spotless/**'
          - '**/src/**/resources/**'
          - '**/entrypoint.sh'
          - '**/bin/*.sh'
          # Kept from the central default: a CI-only change must still run the build,
          # otherwise a workflow edit merges without ever having been exercised.
          - '.github/workflows/**'
    secrets: inherit

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v5
      # There is no root package.json; packageManager lives in ui/package.json, and
      # `defaults.run.working-directory` does not apply to action inputs, so the action
      # has to be told where to read the pnpm version from.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@v5
        with:
          node-version-file: ui/.nvmrc
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4
      - name: Lint charts
        run: |
          helm lint deploy/charts/apus-operator --set bundles.s3Endpoint=http://example
          helm lint deploy/charts/apus-platform --set auth.issuer=https://id.example.net
      - name: Render charts
        run: |
          helm template t deploy/charts/apus-operator --set bundles.s3Endpoint=http://example > /tmp/operator.yaml
          helm template t deploy/charts/apus-platform --set auth.issuer=https://id.example.net > /tmp/platform.yaml
      - name: The values schema actually rejects missing required values
        run: |
          # A schema that never rejects anything is worse than none: it looks like a guard.
          # A `helm template` that fails for an unrelated reason would also pass a bare
          # exit-code check, so grep the error for the field the schema is supposed to guard.
          if error=$(helm template t deploy/charts/apus-platform 2>&1 >/dev/null); then
            echo "values.schema.json did not reject a missing auth.issuer" >&2
            exit 1
          fi
          if ! grep -q '/auth/issuer' <<<"$error"; then
            echo "helm template failed, but not because of auth.issuer:" >&2
            echo "$error" >&2
            exit 1
          fi
          if error=$(helm template t deploy/charts/apus-operator --set bundles.s3Endpoint="" 2>&1 >/dev/null); then
            echo "values.schema.json did not reject an empty bundles.s3Endpoint" >&2
            exit 1
          fi
          if ! grep -q '/bundles/s3Endpoint' <<<"$error"; then
            echo "helm template failed, but not because of bundles.s3Endpoint:" >&2
            echo "$error" >&2
            exit 1
          fi
      - name: Validate against the Kubernetes API schema
        run: |
          kubectl apply --dry-run=client -f /tmp/operator.yaml
          kubectl apply --dry-run=client -f /tmp/platform.yaml
