# Which identity broker sits in front of Apus is intentionally undecided (design spec §15;
# Keycloak 26+ and Zitadel are both under evaluation, both expose standard OIDC discovery). Only
# the JWKS endpoint and the expected issuer are configured -- both from environment, with no
# broker-specific default -- so picking one later is a config change, not a code change.
micronaut:
  application:
    name: apus-api
  security:
    enabled: true
    token:
      jwt:
        enabled: true
        signatures:
          jwks:
            apus-issuer:
              # `url`, not `jwks-uri`. JwksSignatureConfigurationProperties has setUrl() and no
              # setJwksUri(), so `jwks-uri` binds to nothing at all -- and does it silently: the
              # configuration bean is still created, ReactiveJwksSignature is still wired, and
              # the fetcher is simply handed a null URL. No request is made, no exception is
              # thrown, nothing above DEBUG is logged, and every token fails signature validation
              # with a bare 401 no matter which broker issued it. JwksSignatureConfigurationTest
              # exists to keep this bound.
              url: ${APUS_JWT_JWKS_URI}
        claims-validators:
          issuer: ${APUS_JWT_ISSUER}
