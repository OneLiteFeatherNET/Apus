imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

auth:
  # No default on purpose. The API validates JWTs against this issuer; an empty value
  # must fail the install rather than let the API start and accept unvalidated tokens.
  issuer: ""
  jwksUri: ""
  # Not wired into the API's environment yet -- audience validation is not implemented
  # in application.yml (only issuer and jwks-uri are, see design spec §15 point 3, the
  # identity-broker product choice is still open). Declared here so the schema in the
  # next task has somewhere to point once it lands.
  audience: apus

# Teams, invitations and password resets, through Microsoft Graph.
#
# Off by default, and the API says so rather than failing to start: this needs Graph application
# permissions with admin consent -- Group.ReadWrite.All, User.ReadWrite.All, User.Invite.All --
# which a platform may reasonably decline to grant. Without them the console shows those panels
# as unavailable and everything else works unchanged.
#
# Those permissions are directory-wide; Entra has no "these groups only" variant. What narrows
# them is Apus's own DirectoryGuard, which refuses any group no Tenant claims via
# spec.identity.groupId, any user outside one, and any password reset aimed at a privileged
# directory account.
#
# The registration named here MUST NOT be the one the browser uses. That one is a SPA -- a public
# client, which cannot hold a secret and cannot use the client-credentials flow at all.
directory:
  enabled: false
  # The Entra tenant (directory) id.
  tenantId: ""
  # The confidential app registration's client id.
  clientId: ""
  clientSecret:
    # A Secret you create; this chart never templates the value itself.
    secretName: apus-directory-credentials
    key: client-secret

api:
  image:
    repository: harbor.onelitefeather.dev/apus/api
    tag: ""
    pullPolicy: IfNotPresent
  replicaCount: 1
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10001
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      memory: 1Gi
  metrics:
    serviceMonitor:
      # The API does not export Prometheus metrics yet (Phase 8 Task 5 adds
      # micronaut-management and micrometer, exposing /prometheus). Off by default: turning
      # this on before then just wires Prometheus up to a 404, not empty data.
      enabled: false
      interval: 30s
      labels: {}
  serviceAccount:
    create: true
    name: ""
    annotations: {}
  rbac:
    create: true
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

ui:
  image:
    repository: harbor.onelitefeather.dev/apus/ui
    tag: ""
    pullPolicy: IfNotPresent
  replicaCount: 2
  podSecurityContext:
    runAsNonRoot: true
    # The distroless :nonroot base runs as uid 65532, not 10001 like the Java images.
    runAsUser: 65532
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    # The Nitro server only reads from the image; it needs no writable path.
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]
  resources:
    requests:
      cpu: 50m
      # Nitro renders the shell per request: ~63Mi idle, ~115Mi peak at concurrency 100 with
      # the image's --max-old-space-size cap. The 64Mi/128Mi that fitted nginx would OOMKill.
      memory: 128Mi
    limits:
      memory: 256Mi
  # Passed to the container verbatim. NUXT_PUBLIC_* reach the SPA at runtime because the image
  # runs Nitro -- see ui/README.md, "Runtime configuration".
  env: {}
  envFrom: []
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# The management console: tenants, quotas, cluster-wide renders. A second SPA image, served
# under /console on the *same* host as the ui. Same origin on purpose -- the api module
# configures no CORS, so a console on its own hostname could not call it at all.
console:
  # A handful of platform admins, not tenants. Set to false to ship the platform without a
  # management UI: the Deployment, the Service and the ingress rule all disappear together.
  enabled: true
  image:
    repository: harbor.onelitefeather.dev/apus/console
    tag: ""
    pullPolicy: IfNotPresent
  # One replica: the audience is administrators, and a restart costs them a page reload.
  replicaCount: 1
  podSecurityContext:
    runAsNonRoot: true
    # The distroless :nonroot base runs as uid 65532, not 10001 like the Java images.
    runAsUser: 65532
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    # The Nitro server only reads from the image; it needs no writable path.
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]
  resources:
    requests:
      cpu: 50m
      # Same Nitro shell-per-request profile as the ui, at a fraction of the request rate --
      # but the same floor: below this the image's own heap cap does not save it from OOMKill.
      memory: 128Mi
    limits:
      memory: 256Mi
  # Passed to the container verbatim. NUXT_PUBLIC_* reach the SPA at runtime because the image
  # runs Nitro -- see ui/README.md, "Runtime configuration". The console needs the same three
  # values as the ui, and shares the ui's OIDC client (see NOTES.txt for the redirect URIs the
  # broker must have registered).
  env: {}
  envFrom: []
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# OpenTelemetry for the API. The SDK is a no-op with no endpoint set, so leaving this empty
# ships the instrumentation without turning it on. HTTP server spans come from Micronaut's
# own instrumentation; the API adds spans only where the work is not already one request.
otel:
  # e.g. http://alloy-receiver.monitoring.svc:4317
  endpoint: ""
  serviceName: ""
  logsExporter: otlp
  extraEnv: {}

ingress:
  enabled: false
  className: nginx
  annotations: {}
  host: ""
  tls:
    enabled: false
    secretName: ""
    issuerRef:
      name: ""
      kind: ClusterIssuer
