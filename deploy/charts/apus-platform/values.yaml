imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

auth:
  # No default on purpose. The API validates JWTs against this issuer; an empty value
  # must fail the install rather than let the API start and accept unvalidated tokens.
  issuer: ""
  jwksUri: ""
  # Not wired into the API's environment yet -- audience validation is not implemented
  # in application.yml (only issuer and jwks-uri are, see design spec §15 point 3, the
  # identity-broker product choice is still open). Declared here so the schema in the
  # next task has somewhere to point once it lands.
  audience: apus

api:
  image:
    repository: harbor.onelitefeather.dev/apus/api
    tag: ""
    pullPolicy: IfNotPresent
  replicaCount: 1
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10001
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      memory: 1Gi
  metrics:
    serviceMonitor:
      # The API does not export Prometheus metrics yet (Phase 8 Task 5 adds
      # micronaut-management and micrometer, exposing /prometheus). Off by default: turning
      # this on before then just wires Prometheus up to a 404, not empty data.
      enabled: false
      interval: 30s
      labels: {}
  serviceAccount:
    create: true
    name: ""
    annotations: {}
  rbac:
    create: true
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

ui:
  image:
    repository: harbor.onelitefeather.dev/apus/ui
    tag: ""
    pullPolicy: IfNotPresent
  replicaCount: 2
  podSecurityContext:
    runAsNonRoot: true
    # The distroless :nonroot base runs as uid 65532, not 10001 like the Java images.
    runAsUser: 65532
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    # The Nitro server only reads from the image; unlike nginx (which wrote its pid and cache
    # below /tmp and /var/cache) it needs no writable path anywhere.
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]
  resources:
    requests:
      cpu: 50m
      # Higher than the 64Mi/128Mi that fitted nginx: Nitro costs ~63Mi before it serves
      # anything and renders the SPA shell per request, so measured at concurrency 100 it
      # peaks around 115Mi (with the image's own --max-old-space-size=64 cap; see
      # ui/Dockerfile -- 153Mi without it). 128Mi would have been an OOMKill under load, not
      # a tight fit.
      memory: 128Mi
    limits:
      memory: 256Mi
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

ingress:
  enabled: false
  className: nginx
  annotations: {}
  host: ""
  tls:
    enabled: false
    secretName: ""
    issuerRef:
      name: ""
      kind: ClusterIssuer
