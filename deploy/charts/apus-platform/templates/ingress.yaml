{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "apus-platform.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "apus-platform.labels" . | nindent 4 }}
  {{- if or .Values.ingress.tls.enabled .Values.ingress.annotations }}
  annotations:
    {{- if .Values.ingress.tls.enabled }}
    cert-manager.io/cluster-issuer: {{ .Values.ingress.tls.issuerRef.name | quote }}
    {{- end }}
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      secretName: {{ .Values.ingress.tls.secretName | default (printf "%s-tls" (include "apus-platform.fullname" .)) }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          # /api must come before / -- ingress-nginx (and most controllers) evaluate paths
          # in the order they appear for a given host, so a catch-all "/" listed first would
          # swallow every API request and the UI's own index.html would answer them instead.
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "apus-platform.api.fullname" . }}
                port:
                  name: http
          {{- if .Values.console.enabled }}
          # Between /api and /, for the same ordering reason: the catch-all below would
          # otherwise swallow the console. No rewrite annotation -- the console owns the prefix
          # itself via app.baseURL (ui/apps/console/nuxt.config.ts), which keeps this rule
          # portable across ingress controllers that spell rewrites differently.
          - path: /console
            pathType: Prefix
            backend:
              service:
                name: {{ include "apus-platform.console.fullname" . }}
                port:
                  name: http
          {{- end }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "apus-platform.ui.fullname" . }}
                port:
                  name: http
{{- end }}
