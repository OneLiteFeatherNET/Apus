apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "apus-platform.ui.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "apus-platform.componentLabels" (dict "ctx" . "component" "ui") | nindent 4 }}
spec:
  replicas: {{ .Values.ui.replicaCount }}
  strategy:
    # The UI is a stateless static SPA served straight out of its image -- no local state to
    # lose by running old and new pods side by side.
    type: RollingUpdate
  selector:
    matchLabels:
      {{- include "apus-platform.componentSelectorLabels" (dict "ctx" . "component" "ui") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "apus-platform.componentLabels" (dict "ctx" . "component" "ui") | nindent 8 }}
        {{- with .Values.ui.podLabels }}{{- toYaml . | nindent 8 }}{{- end }}
      {{- with .Values.ui.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.ui.podSecurityContext | nindent 8 }}
      containers:
        - name: ui
          image: {{ include "apus-platform.image" (dict "image" .Values.ui.image "ctx" .) }}
          imagePullPolicy: {{ .Values.ui.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.ui.securityContext | nindent 12 }}
          ports:
            # Nitro's own default is 3000; the image pins PORT=8080 (see ui/Dockerfile), and
            # the distroless :nonroot base runs as uid 65532, so nothing here ever needs a
            # privileged port.
            - name: http
              containerPort: 8080
              protocol: TCP
          # No env injected yet, but no longer because it is impossible: with the Nitro
          # server now in the image (it replaced nginx), NUXT_PUBLIC_API_BASE_URL,
          # NUXT_PUBLIC_OIDC_ISSUER and NUXT_PUBLIC_OIDC_CLIENT_ID do reach the shell that
          # Nitro renders per request. Wiring them to chart values is what unblocks item 5 of
          # docs/superpowers/specs/2026-08-13-helm-charts-design.md ("the dashboard is not
          # configurable at all", i.e. no installation can log in) and is deliberately left
          # to its own change -- it needs new values, schema entries and defaults.
          readinessProbe:
            # Static SPA: a 200 on the root is a sufficient signal, no management endpoint
            # needed like the API.
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml .Values.ui.resources | nindent 12 }}
      {{- with .Values.ui.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ui.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ui.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
