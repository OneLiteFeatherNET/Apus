image:
  repository: harbor.onelitefeather.dev/apus/operator
  # Empty on purpose: falls back to .Chart.AppVersion so the chart version and the
  # image version cannot drift apart. Override only to pin a hotfix image.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# The images the operator uses for the workloads it creates itself (renders, ingests,
# hosting). They are not deployed by this chart -- the operator builds Jobs and
# Deployments from custom resources and needs to know which image to reference.
images:
  runner:
    repository: harbor.onelitefeather.dev/apus/runner
    tag: ""
  ingest:
    repository: harbor.onelitefeather.dev/apus/ingest
    tag: ""
  hosting:
    repository: harbor.onelitefeather.dev/apus/hosting
    tag: ""

crds:
  # The six CRDs ship as templates so that `helm upgrade` actually updates them.
  # Set to false only if your organisation manages CRDs separately.
  install: true

rook:
  namespace: rook-ceph
  cephObjectStore: ceph-objectstore
  bucketStorageClass: ceph-bucket

bundles:
  bucket: apus-bundles
  s3Endpoint: ""
  s3Region: us-east-1
  credentialsSecret: apus-bundle-credentials

# One instance of the tenant application per tenant, served at https://<host>/t/<tenant>/.
# The operator creates a Deployment, a Service and an Ingress in each tenant's own namespace
# -- the Ingress has to live there, since an Ingress may only reference a Service in its own
# namespace.
#
# Off by default: an empty host disables the feature entirely. An instance with no host would
# have nothing to serve it, and a Deployment nobody can reach costs a pod per tenant.
#
# One image serves every tenant. NUXT_APP_BASE_URL moves the served prefix at runtime, so a
# tenant instance differs from the platform chart's own `ui` in exactly one variable.
#
# Registering the two redirect URIs each instance needs is a manual step -- the operator has no
# permission on the app registration. They are reported on Tenant.status.redirectUris; see the
# notes printed after install.
tenantUi:
  # e.g. apus.example.dev -- the same host the apus-platform ingress serves.
  host: ""
  image:
    repository: harbor.onelitefeather.dev/apus/ui
    # Empty falls back to .Chart.AppVersion, like every other image here.
    tag: ""
  # Must match the apus-platform ingress's class: both serve paths on the same host.
  ingressClassName: nginx
  # Handed to every instance as NUXT_PUBLIC_*. None is a secret -- this is a public OIDC client
  # and all of it ends up in the served HTML by design. Every value is identical between
  # tenants; only the base path differs, and the operator computes that.
  #
  # The origin only, with no /api suffix: the typed client already asks for paths beginning
  # with /api, so a suffix here produces /api/api/tenants and a bare 403.
  apiBaseUrl: ""
  oidc:
    issuer: ""
    clientId: ""
    # Entra-specific and not optional there: asking for only `openid profile email` returns a
    # token addressed to Microsoft Graph, which the API rejects.
    scope: ""

metrics:
  enabled: true
  port: 8080
  serviceMonitor:
    enabled: false
    interval: 30s
    labels: {}

serviceAccount:
  create: true
  name: ""
  annotations: {}

rbac:
  create: true

replicaCount: 1

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi

# OpenTelemetry. The SDK reads the standard OTEL_* variables and is a no-op when no endpoint
# is set, so leaving this empty ships the instrumentation without turning it on.
#
# The operator also forwards these to the ingest jobs it creates, together with the current
# trace context -- so a slow ingest shows up as part of the reconciliation's trace rather
# than as an unrelated one.
otel:
  # e.g. http://alloy-receiver.monitoring.svc:4317
  endpoint: ""
  # Overrides the service name a trace is attributed to; defaults to the release name.
  serviceName: ""
  # otlp exports log records alongside spans; none keeps logs on the console only.
  logsExporter: otlp
  # Extra OTEL_* variables, for anything this chart does not model (headers, sampler args).
  extraEnv: {}

nodeSelector: {}
tolerations: []
affinity: {}
